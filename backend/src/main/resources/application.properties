spring.application.name=slack-clone-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/slack_clone_db}
spring.datasource.username=${DB_USERNAME:slack_user}
spring.datasource.password=${DB_PASSWORD:slack_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=UTC

app.jwt.secret=${JWT_SECRET:c2xhY2stY2xvbmUtZGV2LWxvY2FsLW9ubHktc2VjcmV0LWNoYW5nZS1tZS0yMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.directory=${UPLOAD_DIRECTORY:uploads}


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest